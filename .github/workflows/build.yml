name: Build SKSE plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize x64 MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_C_COMPILER=cl `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix package --component Mod
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path package/SKSE/Plugins/GazBodyslideReader.dll)) { throw 'DLL missing from package' }

      - uses: actions/upload-artifact@v4
        with:
          name: GazBodyslideReader
          path: package/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GazBodyslideReader
          path: package
      - name: Zip mod
        run: cd package && zip -r ../GazBodyslideReader.zip .
      - name: Publish tagged build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" GazBodyslideReader.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes "DLL-only update. Install after the original Nexus mod to retain its compiled Papyrus script. Intended for Skyrim 1.7.104 with matching SKSE and Address Library; in-game compatibility not yet verified."
